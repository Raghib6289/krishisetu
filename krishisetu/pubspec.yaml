name: krishisetu
description: "KrishiSetu - AI-Powered Direct Agricultural Marketplace, Logistics & Demand Forecasting for SIH 2026."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & Real-time WebSockets
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  http: ^1.2.1

  # Data Visualization & Charts
  fl_chart: ^0.68.0

  # Mapping & Route Visualization
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Forms, Photos & Utilities
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
